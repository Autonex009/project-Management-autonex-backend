global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # The token is written to a file by entrypoint.sh from METRICS_TOKEN, because
  # Prometheus does not expand environment variables in this config and the
  # secret must not be committed.

  # Scraped over the public domain, not the private network. uvicorn cannot
  # serve both: asyncio forces IPV6_V6ONLY on an AF_INET6 socket, so binding ::
  # for private scraping would stop Railway's IPv4 public proxy reaching the
  # app at all. TLS plus the bearer token is what protects this path, and
  # /metrics answers 404 without the token.
  - job_name: backend
    scheme: https
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /tmp/metrics_token
    static_configs:
      - targets: ["project-management-autonex-backend-production.up.railway.app"]

  # The worker stays private: its metrics server is a socketserver, which does
  # not set IPV6_V6ONLY, so binding :: is genuinely dual-stack there.
  - job_name: worker
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /tmp/metrics_token
    static_configs:
      - targets: ["worker-service.railway.internal:9110"]

  # Prometheus scraping itself. Free, and it answers "is the scraper healthy?"
  # without a second system to watch this one.
  - job_name: prometheus
    static_configs:
      - targets: ["[::1]:9090"]
